name: url-shortener-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-urlshortener_dev}
    ports:
      - "${DEV_POSTGRES_PORT:-5433}"
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-postgres} -d ${DEV_POSTGRES_DB:-urlshortener_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    container_name: dev-backend
    image: ${DEV_BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${DEV_JWT_SECRET}
      JWT_EXPIRES_IN: ${DEV_JWT_EXPIRES_IN:-7d}
      BASE_URL: ${DEV_BASE_URL:-http://localhost:4000}
      FRONTEND_URL: ${DEV_FRONTEND_URL:-http://localhost:3000}
      PORT: 4000
    ports:
      - "${DEV_BACKEND_PORT:-4001}:4000"
    networks:
      - app-network
      - proxy-network

  frontend:
    container_name: dev-frontend
    image: ${DEV_FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${DEV_FRONTEND_PORT:-3001}:3000"
    networks:
      - app-network
      - proxy-network

volumes:
  dev_db_data:

networks:
  app-network:
    name: url-shortener-dev-net
  proxy-network:
    name: proxy-network
    external: true
