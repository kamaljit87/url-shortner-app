name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (as pushed by Deploy Development, e.g. 2026.07.28-a1b2c3d)"
        required: true
  pull_request:
    types:
      - closed

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'development'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG=$(echo "${{ github.event.pull_request.body }}" | grep -oP '(?<=<!-- image-tag: )[^ ]+(?= -->)' || true)
            if [ -z "$TAG" ]; then
              echo "Could not find an image-tag marker in the PR body — refusing to deploy." >&2
              exit 1
            fi
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $TAG"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --verbose

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.value }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.value }}
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -euo pipefail

            cd /root/url-shortner-app

            git pull

            if [ ! -f docker-compose.prod.yml ] || [ ! -f .env ]; then
              echo "docker-compose.prod.yml or .env not found"
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            # Save current deployment for rollback
            grep '^BACKEND_IMAGE=' .env | cut -d= -f2- > backend.prev || true
            grep '^FRONTEND_IMAGE=' .env | cut -d= -f2- > frontend.prev || true

            # Update image tags
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_IMAGE|" .env
            else
              echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> .env
            fi

            if grep -q '^FRONTEND_IMAGE=' .env; then
              sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_IMAGE|" .env
            else
              echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> .env
            fi

            echo "Deploying images:"
            grep 'IMAGE=' .env

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f

      - name: Wait for application
        run: sleep 20

      - name: Health Check
        run: |
          curl --fail https://go2url.xyz
          curl --fail https://go2url.xyz/health

      - name: Smoke Tests
        run: |
          curl --fail https://go2url.xyz
          curl --fail https://go2url.xyz/health
          curl --fail https://go2url.xyz/login

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://go2url.xyz
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            set -e

            cd /root/url-shortner-app

            BACKEND_PREV=$(cat backend.prev 2>/dev/null || true)
            FRONTEND_PREV=$(cat frontend.prev 2>/dev/null || true)

            if [ -z "$BACKEND_PREV" ] || [ -z "$FRONTEND_PREV" ]; then
              echo "No previous deployment found. Skipping rollback."
              exit 0
            fi

            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_PREV|" .env
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_PREV|" .env

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans