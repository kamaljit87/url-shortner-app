name: url-shortener-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urlshortener}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    container_name: backend
    image: ${BACKEND_IMAGE:-ghcr.io/kamaljit87/url-shortner-app-backend:${{ github.sha }}}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - app-network
      - proxy-network

  frontend:
    container_name: frontend
    image: ${FRONTEND_IMAGE:-ghcr.io/kamaljit87/url-shortner-app-frontend:${{ github.sha }}}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - app-network
      - proxy-network

volumes:
  db_data:

networks:
  app-network:
    name: url-shortener-prod-net
  proxy-network:
    name: proxy-network
    external: true
