name: reverse-proxy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/conf.d:/etc/nginx/conf.d:ro
      - ./proxy/certs:/etc/nginx/certs:ro
      - ./proxy/logs:/var/log/nginx
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
